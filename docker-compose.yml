# ===========================================================================
# CineMind AI — Docker Compose (local development)
# ===========================================================================
#
# Usage:
#   1. Place your data/models in the project directories:
#        data/tier1_clean_movies.csv
#        models/tier1_movie_embeddings.pkl
#
#   2. Copy .env.example to .env and set your GROQ_API_KEY
#
#   3. Run:
#        docker compose up --build
#
#   4. Open http://localhost:8000 in your browser
# ===========================================================================

services:
  cinemind:
    build: .
    container_name: cinemind-app
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
